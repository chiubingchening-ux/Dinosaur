<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈利波特：究極終端魔幻測驗</title>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --magic-navy: #0a0e17;
            --magic-card: #131924;
            --text-light: #f3edd7;
            --text-gray: #9ca3af;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --font-magic: 'Cinzel', 'Georgia', 'PingFang TC', 'Microsoft JhengHei', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--magic-navy);
            color: var(--text-light);
            font-family: var(--font-magic);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 魔法全螢幕背景 */
        .bg-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -3;
            background-image: url('https://media.gq.com.tw/photos/6517ffc98254b07004e5fb2a/16:9/w_2560%2Cc_limit/EcyuIbsU0AArMzI.jpeg');
            background-size: cover;
            background-position: center;
            filter: blur(10px);
            transform: scale(1.05);
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background: radial-gradient(circle, rgba(19,25,36,0.6) 0%, rgba(10,14,23,0.98) 100%);
        }

        canvas#magic-particles {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* 音樂控制列 */
        .media-controller {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(19, 25, 36, 0.9);
            padding: 10px 18px;
            border-radius: 30px;
            border: 2px solid var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
            backdrop-filter: blur(5px);
        }

        .media-btn {
            background: none; border: none;
            color: var(--gold-primary);
            font-size: 1.2rem; cursor: pointer;
            transition: transform 0.2s;
        }

        .media-btn:hover { transform: scale(1.1); }
        .volume-slider { width: 80px; accent-color: var(--gold-primary); cursor: pointer; }

        /* 羊皮紙魔法卡片框架 */
        .game-wrapper {
            width: 90%;
            max-width: 680px;
            min-height: 550px;
            background: rgba(19, 25, 36, 0.92);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            animation: cardFloat 6s ease-in-out infinite;
            display: none;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(0.5deg); }
        }

        .active-view { display: block; animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .shake-effect { animation: wandZap 0.4s ease-in-out; }
        @keyframes wandZap { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px) rotate(-1deg); } 40%, 80% { transform: translateX(8px) rotate(1deg); } }

        /* Logo 與 Banner */
        .main-logo-holder { text-align: center; margin-bottom: 20px; }
        .main-logo-img {
            width: 100%; max-width: 220px; height: auto;
            border-radius: 50%; border: 2px solid var(--gold-primary);
            box-shadow: 0 0 25px var(--gold-glow);
        }

        .title-banner { text-align: center; margin-bottom: 25px; }
        .title-banner h1 {
            font-size: 2.2rem; color: var(--text-light);
            text-shadow: 0 0 15px var(--gold-glow), 2px 2px 4px #000;
            letter-spacing: 2px; margin-bottom: 5px;
        }
        .title-banner p { font-size: 1.1rem; color: var(--gold-primary); letter-spacing: 3px; font-weight: bold; }

        /* 魔法按鈕 */
        .btn-stack { display: flex; flex-direction: column; gap: 16px; margin-top: 25px; }
        .magic-btn {
            background: linear-gradient(135deg, #1a2333 0%, #0d131f 100%);
            border: 1px solid var(--gold-primary);
            color: var(--text-light);
            padding: 16px 28px; font-size: 1.1rem; font-weight: bold; letter-spacing: 2px;
            border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s;
        }
        .magic-btn:hover { box-shadow: 0 0 25px var(--gold-glow); background: var(--gold-primary); color: #0a0e17; transform: translateY(-2px); }

        /* HUD 資訊面板 */
        .info-panel { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid rgba(212, 175, 55, 0.3); padding-bottom: 12px; }
        .badge-level { background: var(--gold-primary); color: #0a0e17; padding: 6px 14px; border-radius: 4px; font-size: 0.95rem; font-weight: bold; box-shadow: 0 0 10px var(--gold-glow); }
        .hud-text { font-size: 1rem; color: var(--text-light); }
        .hud-text span { color: var(--gold-primary); font-weight: bold; }

        /* 進度條 */
        .progress-container { width: 100%; height: 10px; background: #0d131f; border-radius: 6px; margin-bottom: 25px; overflow: hidden; border: 1px solid rgba(212,175,55,0.2); }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #f3edd7, var(--gold-primary)); box-shadow: 0 0 10px var(--gold-glow); transition: width 0.4s; }

        /* 題目核心區 */
        .quiz-body { min-height: 280px; }
        .question-text { font-size: 1.35rem; line-height: 1.6; margin-bottom: 25px; color: var(--text-light); border-left: 5px solid var(--gold-primary); padding-left: 15px; }
        .options-list { display: flex; flex-direction: column; gap: 14px; }
        .option-item { background: rgba(26, 35, 51, 0.7); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 8px; padding: 15px 20px; font-size: 1.05rem; cursor: pointer; transition: all 0.2s; }
        .option-item:hover { background: rgba(38, 50, 72, 0.9); border-color: var(--gold-primary); padding-left: 26px; }

        /* 回饋與狀態 */
        .option-item.correct { background: rgba(46, 204, 113, 0.25) !important; border-color: var(--correct-green) !important; color: var(--correct-green); font-weight: bold; }
        .option-item.wrong { background: rgba(231, 76, 60, 0.25) !important; border-color: var(--wrong-red) !important; color: var(--wrong-red); }
        .option-item.disabled { pointer-events: none; opacity: 0.4; }
        .option-item.disabled.correct { opacity: 1; }
        .option-item.vanished { opacity: 0 !important; pointer-events: none; transform: scale(0.8); transition: all 0.5s ease; }

        .feedback-panel { margin-top: 25px; background: #0d131f; border-radius: 8px; padding: 20px; border-top: 4px solid var(--gold-primary); display: none; }
        .feedback-status { font-size: 1.3rem; font-weight: bold; margin-bottom: 8px; }
        .feedback-status.is-correct { color: var(--correct-green); }
        .feedback-status.is-wrong { color: var(--wrong-red); }
        .explanation-text { font-size: 0.95rem; color: var(--text-gray); line-height: 1.5; margin-bottom: 15px; }

        /* 驚喜事件覆蓋層 */
        .surprise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 14, 0.95); z-index: 200;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease; padding: 20px; text-align: center;
        }
        .surprise-overlay.show { opacity: 1; pointer-events: auto; }
        .surprise-title { font-size: 2.5rem; color: var(--gold-primary); text-shadow: 0 0 20px var(--gold-glow); margin-bottom: 15px; }
        .surprise-desc { font-size: 1.2rem; margin-bottom: 30px; max-width: 500px; color: var(--text-light); line-height: 1.6; }

        /* 開學通知信專用裝飾 */
        .letter-particle {
            position: absolute; width: 90px; height: 60px;
            background: #f4ebd0; border: 2px solid #5c1d1d; border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); pointer-events: auto; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s, opacity 0.4s;
        }
        .letter-particle::after {
            content: '✉'; font-size: 1.5rem; color: #5c1d1d;
        }
        .letter-popup-content {
            background: #f4ebd0; color: #111; padding: 30px; border-radius: 4px;
            box-shadow: 0 0 30px rgba(212,175,55,0.8); max-width: 450px; border: 3px double #5c1d1d;
            display: none; animation: fadeIn 0.4s ease-out forwards;
        }

        /* 排行榜與輸入 */
        .board-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: var(--text-light); }
        .board-table th, .board-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(212,175,55,0.1); }
        .board-table th { color: var(--gold-primary); border-bottom: 2px solid var(--gold-primary); }
        .input-magic { background: #0d131f; border: 1px solid var(--gold-primary); color: white; padding: 12px 18px; font-size: 1.1rem; border-radius: 6px; width: 100%; margin-bottom: 20px; text-align: center; outline: none; }
        .input-magic:focus { box-shadow: 0 0 15px var(--gold-glow); }
        .final-score-callout { font-size: 2rem; color: var(--gold-primary); text-align: center; margin: 20px 0; text-shadow: 0 0 10px var(--gold-glow); }
        .final-rank-title { font-size: 1.4rem; text-align: center; margin-bottom: 25px; }

        #flash-overlay { position: fixed; top:0; left:0; width:100vw; height:100vh; pointer-events: none; z-index: 99; opacity: 0; transition: opacity 0.1s; }
    </style>
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>
    <canvas id="magic-particles"></canvas>
    <div id="flash-overlay"></div>

    <!-- 背景音樂載體 (霍格華茲經典配樂原聲帶) -->
    <iframe id="yt-player-raw" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" 
            src="https://www.youtube.com/embed/yPZUAb82Kuc?enablejsapi=1&autoplay=0&controls=0&loop=1&playlist=yPZUAb82Kuc&rel=0" 
            frameborder="0" allow="autoplay"></iframe>

    <div class="media-controller">
        <button class="media-btn" id="mute-toggle-btn" onclick="toggleMute()">🔊</button>
        <input type="range" class="volume-slider" id="vol-ctrl" min="0" max="100" value="40" oninput="changeVolume(this.value)">
    </div>

    <!-- 驚喜事件動態覆蓋層 -->
    <div class="surprise-overlay" id="surprise-screen">
        <div id="surprise-dynamic-content">
            <!-- 驚喜內容動態注入 -->
        </div>
    </div>

    <!-- 主選單視圖 -->
    <div class="game-wrapper active-view" id="view-home">
        <div class="main-logo-holder">
            <img src="https://img.linetv.tw/large/drama/12888-p_211127.jpg" alt="Hogwarts Crest" class="main-logo-img">
        </div>
        <div class="title-banner">
            <h1>✨ 哈利波特：究極終端魔幻測驗</h1>
            <p>50題 驚喜極限版</p>
        </div>
        <div class="btn-stack">
            <button class="magic-btn" onclick="switchView('view-setup')">🔮 開始入學測驗</button>
            <button class="magic-btn" onclick="showRankingsView()">🏆 巫師名人堂</button>
            <button class="magic-btn" style="border-color:#555; color:#888;" onclick="clearRankings()">🗑 清除紀錄</button>
        </div>
    </div>

    <!-- 註冊名稱視圖 -->
    <div class="game-wrapper" id="view-setup">
        <div class="title-banner">
            <h1>魔杖選擇儀式</h1>
            <p>請在羊皮紙上簽署你的巫師大名</p>
        </div>
        <div style="margin-top: 20px;">
            <input type="text" id="player-name-input" class="input-magic" placeholder="例如：哈利波特..." maxlength="12">
            <div class="btn-stack">
                <button class="magic-btn" onclick="initiateQuizGame()">進入霍格華茲</button>
                <button class="magic-btn" style="border-color:#555; color:#aaa;" onclick="switchView('view-home')">返回大廳</button>
            </div>
        </div>
    </div>

    <!-- 問答視圖 -->
    <div class="game-wrapper" id="view-quiz">
        <div class="info-panel">
            <div id="hud-level-badge" class="badge-level">🧙‍♂️ 一年級生</div>
            <div class="hud-text">學院積分: <span id="hud-score-counter">0</span> / 50</div>
            <div class="hud-text">進度: <span id="hud-index-counter">1</span> / 50</div>
        </div>
        <div class="progress-container">
            <div id="quiz-progress-inner" class="progress-bar"></div>
        </div>

        <div class="quiz-body">
            <div id="question-box" class="question-text">正在調配魔藥...</div>
            <div id="options-box" class="options-list"></div>
        </div>

        <div id="feedback-box" class="feedback-panel">
            <div id="feedback-alert" class="feedback-status">✨ 完美的咒語！</div>
            <div id="explanation-box" class="explanation-text">解析</div>
            <div style="display:flex; justify-content: flex-end;">
                <button class="magic-btn" style="padding: 10px 24px; font-size:1rem;" id="next-btn-trigger" onclick="advanceNextQuestion()">前進下一題</button>
            </div>
        </div>
    </div>

    <!-- 結算視圖 -->
    <div class="game-wrapper" id="view-result">
        <div class="title-banner">
            <h1>普等巫術測驗 (O.W.Ls) 報告</h1>
            <p>你的魔法天賦評定結果已出爐</p>
        </div>
        <div class="final-score-callout">
            最終獲得積分：<span id="final-score-num">0</span> / 50
        </div>
        <div id="final-rank-badge" class="final-rank-title" style="color: var(--gold-primary);">
            榮獲稱號：🧙‍♂️ 梅林勳章一級大法師
        </div>
        <div class="btn-stack">
            <button class="magic-btn" onclick="switchView('view-home')">重返霍格華茲特快車</button>
        </div>
    </div>

    <!-- 排行榜視圖 -->
    <div class="game-wrapper" id="view-rank">
        <div class="title-banner">
            <h1>🏆 頂尖魔法師石碑</h1>
            <p>前 10 名最高積分大巫師</p>
        </div>
        <table class="board-table">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>巫師姓名</th>
                    <th>積分</th>
                    <th>日期</th>
                </tr>
            </thead>
            <tbody id="rank-table-body"></tbody>
        </table>
        <div class="btn-stack" style="margin-top: 30px;">
            <button class="magic-btn" onclick="switchView('view-home')">返回大廳</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 完整 50 題魔法題庫
        // ==========================================
        const quizDatabase = [
            { q: "哈利波特在霍格華茲入學通知信上，第一封信寄到的房間是？", a: "樓梯下的碗櫥", b: "水蠟樹街四號二樓臥室", c: "破釜酒吧11號房", d: "地窖", ans: "A", exp: "哈利最初與德思禮一家同住時，睡在樓梯下的狹小碗櫥內。" },
            { q: "佛地魔在學生時代的名字是什麼？", a: "蓋勒·葛林戴華德", b: "湯姆·馬佛魯·瑞斗", c: "海帕夏·史密斯", d: "巴提·柯羅奇", ans: "B", exp: "佛地魔本名湯姆·瑞斗，後來他將名字重組為「我是佛地魔王」。" },
            { q: "鄧不利多辦公室的入口守門石雕是什麼生物？", a: "鳳凰", b: "滴水嘴石獸", c: "三頭犬", d: "人面獅身獸", ans: "B", exp: "校長室入口是一隻巨大的滴水嘴石獸，對牠說出正確的甜點密碼才會讓路。" },
            { q: "魔法世界中，要進入斜角巷需要用魔杖敲擊破釜酒吧後牆的哪一塊磚？", a: "垃圾桶上方往上三塊、往右兩塊", b: "地面往上五塊", c: "正中央那一塊", d: "左側角落倒數第三塊", ans: "A", exp: "用魔杖在垃圾桶上方往上數三塊、再往右數兩塊的磚牆上敲三下，斜角巷的通道就會開啟。" },
            { q: "哈利波特的護法是一隻什麼動物？", a: "水獺", b: "雄鹿", c: "牝鹿", d: "狼", ans: "B", exp: "哈利繼承了他父親詹姆·波特的護法形態——一隻雄鹿。" },
            { q: "榮恩·衛斯理的長兄「比爾·衛斯理」在古靈閣擔任什麼職務？", a: "馴龍師", b: "解咒師", c: "財富主管", d: "大堂守衛", ans: "B", exp: "比爾在埃及為古靈閣擔任解咒師，負責破解古墓中的惡咒。" },
            { q: "妙麗·格蘭傑的父母在麻瓜世界從事什麼職業？", a: "大學教授", b: "牙醫", c: "律師", d: "銀行家", ans: "B", exp: "妙麗的雙親都是麻瓜界的牙醫，這讓巫師世界的人感到十分新奇。" },
            { q: "下列哪一樣不是佛地魔的「分靈體」之一？", a: "雷文克勞的王冕", b: "赫夫帕夫的金杯", c: "葛來分多的寶劍", d: "馬佛魯·瑞斗的戒指", ans: "C", exp: "葛來分多寶劍吸取了蛇毒，只能用來破壞分靈體，它本身絕對不曾成為分靈體。" },
            { q: "阿茲卡班監獄的看守者是哪種令人絕望的生物？", a: "催狂魔", b: "爆尾釘蝦", c: "地獄三頭犬", d: "惡魔藤", ans: "A", exp: "催狂魔會吸食人類所有的快樂與希望，是阿茲卡班最恐怖的看守者。" },
            { q: "路平教授在三年級黑魔法防禦術課堂上，教大家用什麼咒語對付「幻形怪」？", a: "去去武器走", b: "叱叱荒唐", c: "疾疾護法現身", d: "溫咖癲啦唯啊薩", ans: "B", exp: "對付幻形怪需要使用「叱叱荒唐 (Riddikulus)」，將恐懼的化身變成好笑的模樣。" },
            { q: "妙麗在三年級時為了能同時修完所有課程，使用了什麼魔法道具？", a: "意之鏡", b: "時光器", c: "儲思盆", d: "全知之眼", ans: "B", exp: "麥教授向魔法部特許申請了「時光器」，讓妙麗能夠進行時間穿梭來上課。" },
            { q: "海格在霍格華茲培育、前半身是老鷹、後半身是馬的奇獸叫作？", a: "騎士墜鬼馬", b: "鷹馬（巴嘴）", c: "獅鷲", d: "報喪女妖", ans: "B", exp: "巴嘴是一隻「鷹馬（Hippogriff）」，接近牠必須先鞠躬表示尊敬。" },

        // ==========================================
        // 2. 音效系統 (Web Audio API)
        // ==========================================
        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let globalVolume = 0.4;
        let isMuted = false;

        function playMagicSuccess() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now); // C5
            osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.3); // C6
            gain.gain.setValueAtTime(globalVolume, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.3);
            osc.connect(gain); gain.connect(AudioCtx.destination);
            osc.start(); osc.stop(now + 0.3);
        }

        function playMagicFail() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.4);
            gain.gain.setValueAtTime(globalVolume * 0.7, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain); gain.connect(AudioCtx.destination);
            osc.start(); osc.stop(now + 0.4);
        }

        function playSurpriseZap() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1500, now + 0.5);
            gain.gain.setValueAtTime(globalVolume * 0.5, now);
            gain.gain.linearRampToValueAtTime(0.001, now + 0.5);
            osc.connect(gain); gain.connect(AudioCtx.destination);
            osc.start(); osc.stop(now + 0.5);
        }

        let ytPlayer = null;
        function startMusicPlayback() {

            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
            }
        }
        function changeVolume(value) {
            globalVolume = value / 100;
            const iframe = document.getElementById('yt-player-raw');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({"event":"command","func":"setVolume","args":[value]}), '*');
            }
        }
        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('mute-toggle-btn');
            const iframe = document.getElementById('yt-player-raw');
            btn.innerText = isMuted ? "❌" : "🔊";
            if(iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(JSON.stringify({"event":"command","func": isMuted ? "mute" : "unMute","args":""}), '*');
            }
        }

            if(num <= 30) return "🧹 三年級生";

            return "🦅 男生主席";

        function renderQuestionStructure() {
            // 每5題觸發一次驚喜 (第5, 10, 15, 20... 題)
            if (currentQuizIndex > 0 && currentQuizIndex % 5 === 0) {
                triggerSurpriseEvent((currentQuizIndex / 5) % 5);
                return; 
            }
            actualRenderQuestion();
        }

        function actualRenderQuestion() {
            const quizItem = quizDatabase[currentQuizIndex];
            document.getElementById('hud-level-badge').innerText = getLevelTierLabel(currentQuizIndex);
            document.getElementById('hud-score-counter').innerText = userCurrentScore;
            document.getElementById('hud-index-counter').innerText = currentQuizIndex + 1;
            
            const percent = ((currentQuizIndex + 1) / 50) * 100;
            document.getElementById('quiz-progress-inner').style.width = percent + "%";
            document.getElementById('question-box').innerText = `【${currentQuizIndex + 1}】${quizItem.q}`;
            
            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            
            const arrOpts = [
                { key: 'A', text: quizItem.a },
                { key: 'B', text: quizItem.b },
                { key: 'C', text: quizItem.c },
                { key: 'D', text: quizItem.d }
            ];

            arrOpts.forEach(opt => {
                const div = document.createElement('div');
                div.className = "option-item";
                div.setAttribute('data-key', opt.key);
                div.innerHTML = `<strong>${opt.key}：</strong>&nbsp;${opt.text}`;
                div.onclick = () => evaluateUserAnswer(opt.key, div);
                optBox.appendChild(div);
            });

            document.getElementById('feedback-box').style.display = 'none';
        }

        function evaluateUserAnswer(chosenKey, elementToken) {
            const currentQuestion = quizDatabase[currentQuizIndex];
            const allOptionElements = document.querySelectorAll('.option-item');
            allOptionElements.forEach(el => el.classList.add('disabled'));

            const feedbackAlert = document.getElementById('feedback-alert');
            const flashOverlay = document.getElementById('flash-overlay');
            const quizCard = document.getElementById('view-quiz');

            if(chosenKey === currentQuestion.ans) {
                let pointsGained = isDoubleScoreActive ? 2 : 1;
                userCurrentScore += pointsGained;
                elementToken.classList.add('correct');
                feedbackAlert.innerText = isDoubleScoreActive ? "✨ 福靈劑爆發！雙倍增益：+2 學院積分！" : "✨ 完美的咒語！成功獲得積分！";
                feedbackAlert.className = "feedback-status is-correct";
                playMagicSuccess();

                flashOverlay.style.background = "rgba(46, 204, 113, 0.3)";
                flashOverlay.style.opacity = "1";
                setTimeout(() => flashOverlay.style.opacity = "0", 200);
            } else {
                elementToken.classList.add('wrong');
                feedbackAlert.innerText = "❌ 咒語反彈！不幸痛失分數...";
                feedbackAlert.className = "feedback-status is-wrong";
                playMagicFail();

                allOptionElements.forEach(el => {
                    if(el.getAttribute('data-key') === currentQuestion.ans) el.classList.add('correct');
                });

                flashOverlay.style.background = "rgba(231, 76, 60, 0.3)";
                flashOverlay.style.opacity = "1";
                setTimeout(() => flashOverlay.style.opacity = "0", 200);
                
                quizCard.classList.add('shake-effect');
                setTimeout(() => quizCard.classList.remove('shake-effect'), 400);
            }

            isDoubleScoreActive = false; // 重設福靈劑狀態
            document.getElementById('hud-score-counter').innerText = userCurrentScore;
            document.getElementById('explanation-box').innerText = `正確答案為【${currentQuestion.ans}】。${currentQuestion.exp}`;
            document.getElementById('feedback-box').style.display = 'block';
        }

        function advanceNextQuestion() {
            currentQuizIndex++;
            if(currentQuizIndex < 50) {
                renderQuestionStructure();
            } else {
                concludeQuizSession();
            }
        }

        // ==========================================
        // 5. 驚喜事件核心調度中心
        // ==========================================
        function triggerSurpriseEvent(typeCode) {
            playSurpriseZap();
            const screen = document.getElementById('surprise-screen');
            const container = document.getElementById('surprise-dynamic-content');
            container.innerHTML = '';
            screen.classList.add('show');

            // 根據不同關卡觸發 5 種不同驚喜機制
            if (typeCode === 1) {
                // 驚喜 1: 霍格華茲開學信狂飛 (玩家必須點擊打開信件才能解鎖下一題)
                container.innerHTML = `
                    <div class="surprise-title">🦉 貓頭鷹送信狂潮！！</div>
                    <div class="surprise-desc">成百上千封霍格華茲入學通知信正從壁爐和窗戶瘋狂飛入！快在混亂中點擊並打開其中一封信，才能重回測驗！</div>
                `;
                spawnFlyingLetters(screen);
            } 
            else if (typeCode === 2) {
                // 驚喜 2: 消失咒 (直接幫玩家移除兩個錯誤答案，降低難度)
                container.innerHTML = `
                    <div class="surprise-title">🪄 施展「消去咒 (Evanesco)」</div>
                    <div class="surprise-desc">你的魔杖發出耀眼光芒！強大的消失咒已成功抹除本題的其中兩個錯誤答案！</div>
                    <button class="magic-btn" onclick="applyVanishSurprise()">收下魔咒利多</button>
                `;
            }
            else if (typeCode === 3) {
                // 驚喜 3: 時光器倒轉 (立刻額外獲得 1 分)
                container.innerHTML = `
                    <div class="surprise-title">⏳ 時光器倒轉沙漏</div>
                    <div class="surprise-desc">妙麗悄悄撥動了時光器！時間逆流回上一秒，你從未來的時空中為自己的學院額外偷渡到了 +1 積分！</div>
                    <button class="magic-btn" onclick="applyTimeTurnerSurprise()">啟動時間魔法</button>
                `;
            }
            else if (typeCode === 4) {
                // 驚喜 4: 咆哮信轟炸 (快答挑戰，必須立刻點擊，否則會炸掉)
                container.innerHTML = `
                    <div class="surprise-title">💌 茉莉衛斯理的咆哮信！</div>
                    <div class="surprise-desc" style="color:#e74c3c; font-weight:bold;">「你竟敢偷開飛天汽車！！」咆哮信即將紅透爆炸！快在 5 秒內猛擊拆開牠，否則會震碎你的耳膜！</div>
                    <button class="magic-btn" style="background:#c0392b;" onclick="dismissHowler()">💥 立刻撕碎咆哮信</button>
                `;
            }
            else {
                // 驚喜 5: 福靈劑 (下一題答對得2分)
                container.innerHTML = `
                    <div class="surprise-title">🧪 幸運的「福靈劑 (Felix Felicis)」</div>
                    <div class="surprise-desc">你成功偷喝了一小口金色魔藥。下一題你將獲得無上好運，若答對將觸發【雙倍積分增益】！</div>
                    <button class="magic-btn" onclick="applyLiquidLuckSurprise()">一飲而盡</button>
                `;
            }
        }

        // 驚喜 1: 飛行的開學信
        function spawnFlyingLetters(parentOverlay) {
            const letterCount = 15;
            const lettersCreated = [];

            for (let i = 0; i < letterCount; i++) {
                const letter = document.createElement('div');
                letter.className = 'letter-particle';
                letter.style.top = Math.random() * 80 + 10 + '%';
                letter.style.left = Math.random() * 80 + 5 + '%';
                letter.style.transform = `scale(${Math.random() * 0.4 + 0.8}) rotate(${Math.random() * 40 - 20}deg)`;
                
                letter.onclick = (e) => {
                    e.stopPropagation();
                    playMagicSuccess();
                    
                    // 顯示開箱內容
                    letter.style.display = 'none';
                    const container = document.getElementById('surprise-dynamic-content');
                    container.innerHTML = `
                        <div class="letter-popup-content" style="display:block;">
                            <h3 style="color:#5c1d1d; margin-bottom:15px; font-family:serif;">霍格華茲魔法學校</h3>
                            <p style="color:#222; font-size:0.95rem; line-height:1.6; text-align:left;">
                                親愛的巫師：<br>
                                我們很高興通知您，您已獲准在霍格華茲魔法學校就讀。隨信附上所需書籍及裝備名單。<br>
                                學期定於九月一日開始。<br><br>
                                副校長 米奈娃·麥 謹上
                            </p>
                            <button class="magic-btn" style="margin-top:20px; background:#5c1d1d; width:100%;" onclick="closeSurpriseOverlay()">戴上巫師帽前進</button>
                        </div>
                    `;
                    // 清理其他信件
                    lettersCreated.forEach(l => l.remove());
                };

                parentOverlay.appendChild(letter);
                lettersCreated.push(letter);
            }
        }

        // 關閉驚喜層並重繪題目
        function closeSurpriseOverlay() {
            document.getElementById('surprise-screen').classList.remove('show');
            actualRenderQuestion();
        }

        // 驚喜 2 處理
        function applyVanishSurprise() {
            document.getElementById('surprise-screen').classList.remove('show');
            actualRenderQuestion();
            
            // 延遲一下執行消去
            setTimeout(() => {
                const quizItem = quizDatabase[currentQuizIndex];
                const options = document.querySelectorAll('.option-item');
                let count = 0;
                options.forEach(opt => {
                    const key = opt.getAttribute('data-key');
                    if (key !== quizItem.ans && count < 2) {
                        opt.classList.add('vanished');
                        count++;
                    }
                });
            }, 300);
        }

        // 驚喜 3 處理
        function applyTimeTurnerSurprise() {
            userCurrentScore += 1;
            closeSurpriseOverlay();
        }

        // 驚喜 4 處理
        function dismissHowler() {
            closeSurpriseOverlay();
        }

        // 驚喜 5 處理
        function applyLiquidLuckSurprise() {
            isDoubleScoreActive = true;
            closeSurpriseOverlay();
        }

        // ==========================================
        // 6. 結算與排行榜儲存
        // ==========================================
        function concludeQuizSession() {
            document.getElementById('final-score-num').innerText = userCurrentScore;
            let rankName = "";
            if(userCurrentScore >= 45) rankName = "🧙‍♂️ 梅林勳章一級大法師";
            else if(userCurrentScore >= 35) rankName = "🦅 鳳凰會核心核心幹部";
            else if(userCurrentScore >= 25) rankName = "🦁 葛來分多優秀級長";
            else if(userCurrentScore >= 15) rankName = "🧹 魔法部底層實習生";
            else rankName = "🦉 爆竹 (完全不會魔法)";

            document.getElementById('final-rank-badge').innerText = `榮獲稱號：${rankName}`;
            commitScoreToStorage(registeredPlayerName, userCurrentScore);
            switchView('view-result');
        }

        function commitScoreToStorage(name, score) {
            let records = JSON.parse(localStorage.getItem('hp_magic_ranks')) || [];
            const timestamp = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
            records.push({ name: name, score: score, date: timestamp });
            records.sort((a, b) => b.score - a.score);
            if(records.length > 10) records = records.slice(0, 10);
            localStorage.setItem('hp_magic_ranks', JSON.stringify(records));
        }

        function showRankingsView() {
            const records = JSON.parse(localStorage.getItem('hp_magic_ranks')) || [];
            const tbody = document.getElementById('rank-table-body');
            tbody.innerHTML = '';
            if(records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#555;">石碑上尚未刻下任何先驅名字</td></tr>`;
            } else {
                records.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${idx + 1}</td><td>${escapeHtml(row.name)}</td><td>${row.score}</td><td>${row.date}</td>`;
                    tbody.appendChild(tr);
                });
            }
            switchView('view-rank');
        }

        function clearRankings() {
            if(confirm("確定要抹去魔法石碑上的所有巫師紀錄嗎？")) {
                localStorage.removeItem('hp_magic_ranks');
                alert("記憶已消除（阿哇呾喀呾啦！）。");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // ==========================================
        // 7. 螢光魔法光點粒子背景
        // ==========================================
        const canvas = document.getElementById('magic-particles');
        const ctx = canvas.getContext('2d');
        let particleArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MagicSparkle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * -0.6 - 0.2;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
                this.color = Math.random() > 0.5 ? '#d4af37' : '#7fdbff';
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < -10) {
                    this.y = canvas.height + 10;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particleArray = [];
            for(let i=0; i<40; i++) { particleArray.push(new MagicSparkle()); }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particleArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
