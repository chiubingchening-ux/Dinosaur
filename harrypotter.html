<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>哈利波特知識王 - 終極魔法測驗 Pro Max</title>
    <style>
        :root {
            --gold-light: #ffd700;
            --gold-dark: #b39200;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --blue-magic: #0d1b2a;
            --blue-light: #1b263b;
            --bg-dark: #0a0e14;
            --text-light: #f4f5f6;
            --correct-green: #2ecc71;
            --wrong-red: #e74c3c;
            --font-magic: 'Cinzel', 'Times New Roman', serif, 'PingFang TC', 'Microsoft JhengHei';
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-magic);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 背景與遮罩 */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            background-image: url('https://www.hogwartslegacy.com/images/share.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            transform: scale(1.05);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: radial-gradient(circle, rgba(13,27,42,0.6) 0%, rgba(10,14,20,0.9) 100%);
        }

        canvas#particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* 影音控制列 */
        .media-controller {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(13, 27, 42, 0.7);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid var(--gold-dark);
            box-shadow: 0 0 15px var(--gold-glow);
            backdrop-filter: blur(5px);
        }

        .media-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .media-btn:hover {
            transform: scale(1.1);
        }

        .volume-slider {
            width: 80px;
            accent-color: var(--gold-light);
            cursor: pointer;
        }

        /* 遊戲框架外包 */
        .game-wrapper {
            width: 90%;
            max-width: 680px;
            min-height: 550px;
            background: rgba(27, 38, 59, 0.85);
            border: 2px solid var(--gold-dark);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            animation: cardFloat 6s ease-in-out infinite;
            display: none;
            transform-style: preserve-3d;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .active-view {
            display: block;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 答錯震動特效 */
        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* 首頁與結算排版 */
        .title-banner {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-banner h1 {
            font-size: 2.4rem;
            color: var(--gold-light);
            text-shadow: 0 0 15px var(--gold-glow), 2px 2px 4px #000;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .title-banner p {
            font-size: 1.1rem;
            color: #a4b0be;
            letter-spacing: 1px;
        }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-top: 40px;
        }

        .magic-btn {
            background: linear-gradient(135deg, #1b263b 0%, #0d1b2a 100%);
            border: 1px solid var(--gold-dark);
            color: var(--gold-light);
            padding: 16px 28px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .magic-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .magic-btn:hover::before {
            left: 120%;
        }

        .magic-btn:hover {
            box-shadow: 0 0 25px var(--gold-glow);
            border-color: var(--gold-light);
            transform: translateY(-2px);
            text-shadow: 0 0 5px var(--gold-light);
        }

        /* 遊戲資訊面板 */
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 12px;
        }

        .badge-level {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid var(--gold-light);
            color: var(--gold-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(255,215,0,0.2);
        }

        .hud-text {
            font-size: 1rem;
            color: #d1d8e0;
        }

        .hud-text span {
            color: var(--gold-light);
            font-weight: bold;
        }

        /* 進度條 */
        .progress-container {
            width: 100%;
            height: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 5px;
            margin-bottom: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.1);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
            box-shadow: 0 0 10px var(--gold-glow);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 題目核心 */
        .quiz-body {
            min-height: 280px;
            position: relative;
        }

        .question-text {
            font-size: 1.35rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: var(--text-light);
            text-shadow: 1px 1px 2px #000;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .option-item {
            background: rgba(13, 27, 42, 0.6);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background: rgba(27, 38, 59, 0.9);
            border-color: var(--gold-light);
            padding-left: 26px;
            box-shadow: 0 0 12px rgba(255,215,0,0.1);
        }

        /* 選項反饋與彩蛋抹除樣式 */
        .option-item.correct {
            background: rgba(46, 204, 113, 0.25) !important;
            border-color: var(--correct-green) !important;
            color: var(--correct-green);
            font-weight: bold;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.3);
        }

        .option-item.wrong {
            background: rgba(231, 76, 60, 0.25) !important;
            border-color: var(--wrong-red) !important;
            color: var(--wrong-red);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.3);
        }

        .option-item.erased {
            opacity: 0.15 !important;
            pointer-events: none !important;
            border-style: dashed !important;
            text-decoration: line-through;
            transform: scale(0.95);
        }

        .option-item.disabled {
            pointer-events: none;
            opacity: 0.6;
        }

        .option-item.disabled.correct {
            opacity: 1;
        }

        /* 【新功能】第 5 題限定彩蛋按鈕 */
        .easter-egg-btn {
            position: absolute;
            bottom: -15px;
            right: 0;
            background: linear-gradient(135deg, #741212 0%, #3a0303 100%);
            border: 2px solid #ff7675;
            color: #ff7675;
            padding: 8px 15px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 118, 117, 0.5);
            font-weight: bold;
            display: none;
            z-index: 10;
            animation: pulseGlow 2s infinite;
            transition: all 0.3s;
        }

        .easter-egg-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ff7675;
            color: #fff;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 118, 117, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 118, 117, 0.9); }
        }

        /* 回饋區塊 */
        .feedback-panel {
            margin-top: 25px;
            background: rgba(10, 14, 20, 0.8);
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid var(--gold-light);
            display: none;
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-status {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feedback-status.is-correct { color: var(--correct-green); }
        .feedback-status.is-wrong { color: var(--wrong-red); }

        .explanation-text {
            font-size: 0.95rem;
            color: #b2bec3;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .next-btn-container {
            display: flex;
            justify-content: flex-end;
        }

        /* 排行榜與命名彈窗 */
        .board-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            color: #d1d8e0;
        }

        .board-table th, .board-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }

        .board-table th {
            color: var(--gold-light);
            border-bottom: 2px solid var(--gold-dark);
        }

        .board-table tr:nth-child(1) td { color: var(--gold-light); font-weight: bold; }
        .board-table tr:nth-child(2) td { color: #f1c40f; }
        .board-table tr:nth-child(3) td { color: #e67e22; }

        .input-magic {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--gold-dark);
            color: white;
            padding: 12px 18px;
            font-size: 1.1rem;
            border-radius: 6px;
            width: 100%;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
        }

        .input-magic:focus {
            border-color: var(--gold-light);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .final-score-callout {
            font-size: 1.8rem;
            color: var(--gold-light);
            text-align: center;
            margin: 20px 0;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .final-rank-title {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 25px;
            color: #fff;
        }

        /* 全螢幕爆光特效面版 */
        #flash-overlay {
            position: fixed;
            top:0; left:0; width:100vw; height:100vh;
            pointer-events: none;
            z-index: 99;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        @media(max-width: 600px) {
            .game-wrapper { padding: 20px 15px; }
            .title-banner h1 { font-size: 1.8rem; }
            .question-text { font-size: 1.15rem; }
            .option-item { font-size: 1rem; padding: 12px 15px; }
            .media-controller { top: auto; bottom: 15px; right: 15px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="bg-container"></div>
    <div class="bg-overlay"></div>
    <canvas id="particles"></canvas>
    <div id="flash-overlay"></div>

    <iframe id="yt-player-raw" style="position:absolute; width:1px; height:1px; opacity:0; pointer-events:none;" 
            src="https://www.youtube.com/embed/E2vo0qvKGCM?enablejsapi=1&autoplay=0&controls=0&loop=1&playlist=E2vo0qvKGCM&rel=0" 
            frameborder="0" allow="autoplay"></iframe>

    <div class="media-controller">
        <button class="media-btn" id="mute-toggle-btn" onclick="toggleMute()">🔊</button>
        <input type="range" class="volume-slider" id="vol-ctrl" min="0" max="100" value="50" oninput="changeVolume(this.value)">
    </div>

    <div class="game-wrapper active-view" id="view-home">
        <div class="title-banner">
            <h1>⚡ 哈利波特終極測驗</h1>
            <p>50題巫師完整 Pro Max 版資料庫</p>
        </div>
        <div class="btn-stack">
            <button class="magic-btn" onclick="switchView('view-setup')">開始測驗</button>
            <button class="magic-btn" onclick="showRankingsView()">查看排行榜</button>
            <button class="magic-btn" style="border-color:#7f8c8d; color:#bdc3c7;" onclick="clearRankings()">重設排行榜</button>
        </div>
    </div>

    <div class="game-wrapper" id="view-setup">
        <div class="title-banner">
            <h1>登錄魔法部</h1>
            <p>請寫下魔杖持有者的真實姓名</p>
        </div>
        <div style="margin-top: 40px;">
            <input type="text" id="player-name-input" class="input-magic" placeholder="輸入您的巫師名稱..." maxlength="12">
            <div class="btn-stack">
                <button class="magic-btn" onclick="initiateQuizGame()">進入霍格華茲</button>
                <button class="magic-btn" style="border-color:#7f8c8d; color:#bdc3c7;" onclick="switchView('view-home')">返回主選單</button>
            </div>
        </div>
    </div>

    <div class="game-wrapper" id="view-quiz">
        <div class="info-panel">
            <div id="hud-level-badge" class="badge-level">🔥 夯</div>
            <div class="hud-text">目前分數: <span id="hud-score-counter">0</span> / 50</div>
            <div class="hud-text">進度: <span id="hud-index-counter">1</span> / 50</div>
        </div>
        <div class="progress-container">
            <div id="quiz-progress-inner" class="progress-bar"></div>
        </div>

        <div class="quiz-body">
            <div id="question-box" class="question-text">載入題目中...</div>
            <div id="options-box" class="options-list">
                </div>
            <button id="reparo-egg-btn" class="easter-egg-btn" onclick="triggerReparoMagic()">🪄 施展「復復修」消去法</button>
        </div>

        <div id="feedback-box" class="feedback-panel">
            <div id="feedback-alert" class="feedback-status">✓ 正確！</div>
            <div id="explanation-box" class="explanation-text">解析內容</div>
            <div class="next-btn-container">
                <button class="magic-btn" style="padding: 10px 24px; font-size:1rem;" onclick="advanceNextQuestion()">下一題</button>
            </div>
        </div>
    </div>

    <div class="game-wrapper" id="view-result">
        <div class="title-banner">
            <h1>測驗完成</h1>
            <p>大難不死的男孩見證了你的成績</p>
        </div>
        <div class="final-score-callout">
            總分：<span id="final-score-num">0</span> / 50
        </div>
        <div id="final-rank-badge" class="final-rank-title">
            評定稱號：🏆 霍格華茲傳奇
        </div>
        <div class="btn-stack">
            <button class="magic-btn" onclick="switchView('view-home')">返回主選單</button>
        </div>
    </div>

    <div class="game-wrapper" id="view-rank">
        <div class="title-banner">
            <h1>🏆 魔法部名人堂</h1>
            <p>前 10 名頂尖巫師排行</p>
        </div>
        <div style="max-height: 320px; overflow-y: auto;">
            <table class="board-table">
                <thead>
                    <tr>
                        <th>名次</th>
                        <th>巫師名稱</th>
                        <th>得分</th>
                        <th>日期</th>
                    </tr>
                </thead>
                <tbody id="rank-table-body">
                    </tbody>
            </table>
        </div>
        <div class="btn-stack" style="margin-top: 30px;">
            <button class="magic-btn" onclick="switchView('view-home')">返回主選單</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 完整 50 題題庫定義陣列
        // ==========================================
        const quizDatabase = [
            { q: "請問哈利波特在霍格華茲就讀時，他所屬的學院校徽上是一隻什麼動物？", a: "鷹", b: "蛇", c: "獅子", d: "獾", ans: "C", exp: "哈利所屬的葛來分多學院以獅子為象徵物，代表勇敢與膽識。" },
            { q: "佛地魔的本名是什麼？", a: "蓋勒·葛林戴華德", b: "湯姆·魔佛羅·瑞斗", c: "魯休思·馬份", d: "巴提·柯羅奇", ans: "B", exp: "重組湯姆·魔佛羅·瑞斗（Tom Marvolo Riddle）的字母可得到「我是佛地魔」的宣告。" },
            { q: "哈利第一根魔杖核心是什麼？", a: "龍的心臟神經", b: "鳳凰羽毛", c: "獨角獸毛", d: "迷拉頭髮", ans: "B", exp: "哈利魔杖核心為佛克斯的鳳凰羽毛，與佛地魔的魔杖核心共生。" },
            { q: "霍格華茲魔法學校的校長阿不思·鄧不利多，全名中不包含以下哪一個名字？", a: "博知維", b: "沃夫林", c: "蓋勒", d: "布萊恩", ans: "C", exp: "他的全名為阿不思·博知維·沃夫林·布萊恩·鄧不利多，蓋勒是葛林戴華德的名字。" },
            { q: "海格在哈利十一歲生日時送給他的貓頭鷹名叫什麼？（提示：本題有魔法彩蛋！）", a: "朱頭", b: "嘿美", c: "克魯克山", d: "蘿莉絲夫人", ans: "B", exp: "嘿美（Hedwig）是哈利忠實的雪鴞，一路陪伴他直到最後大戰。" },
            { q: "在《神祕的魔法石》中，保護魔法石的三頭巨犬被海格稱為什麼名字？", a: "尖牙", b: "毛毛", c: "路威", d: "諾伯", ans: "C", exp: "海格將其命名為「路威」（Fluffy），只要聽到音樂就會睡著。" },
            { q: "榮恩·衛斯理的長鼠斑斑，真實身份是哪一位食死人？", a: "彼得·佩迪魯", b: "天狼星·布萊克", c: "雷木思·路平", d: "巴提·柯羅奇二世", ans: "A", exp: "化鼠多年的阿尼馬格斯彼得·佩迪魯（蟲尾），是出賣哈利父母的叛徒。" },
            { q: "妙麗·格蘭傑利用什麼魔法道具，得以在三年級同時修讀多門課程？", a: "時光器", b: "儲思盆", c: "咆哮信", d: "熄燈器", ans: "A", exp: "麥教授破例向魔法部申請了時光器給妙麗，讓她能進行時間旅行修課。" },

        const AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let globalVolume = 0.5;
        let isMuted = false;

        function playMagicToneSuccess() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            createOscillator(523.25, now, 0.15); 
            createOscillator(659.25, now + 0.08, 0.15); 
            createOscillator(783.99, now + 0.15, 0.25); 
        }

        function playMagicToneFailure() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.4);
            
            gain.gain.setValueAtTime(globalVolume * 0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        // 施展彩蛋魔法時的特殊音效
        function playEggMagicSound() {
            if(isMuted) return;
            const now = AudioCtx.currentTime;
            for(let i=0; i<6; i++) {
                createOscillator(600 + (i * 150), now + (i * 0.05), 0.2);
            }
        }

        function createOscillator(freq, startTime, duration) {
            const osc = AudioCtx.createOscillator();
            const gain = AudioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(globalVolume * 0.3, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
            osc.connect(gain);
            gain.connect(AudioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + duration);
        }

            event.target.setVolume(globalVolume * 100);

            }
        }

            globalVolume = value / 100;

                const iframe = document.getElementById('yt-player-raw');
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage(JSON.stringify({"event":"command","func":"setVolume","args":[value]}), '*');
                }
            }
        }

            const inputName = document.getElementById('player-name-input').value.trim();
            if(!inputName) {
                alert("請輸入巫師名諱以通過魔法部屏障！");
                return;
            }
            registeredPlayerName = inputName;
            
            // 強制喚醒 Web Audio API 並播放新替換的 YouTube 魔法曲
            if(AudioCtx.state === 'suspended') {
                AudioCtx.resume();
            }
            startMusicPlayback();
            
            currentQuizIndex = 0;
            userCurrentScore = 0;
            
            renderQuestionStructure();
            switchView('view-quiz');
        }

        function getLevelTierLabel(index) {
            const num = index + 1; 
            if(num <= 10) return "🔥 夯";
            if(num <= 20) return "👑 頂級";
            if(num <= 30) return "💪 人上人";
            if(num <= 40) return "🤖 NPC";
            return "🗑️ 拉";
        }

        function renderQuestionStructure() {
            const quizItem = quizDatabase[currentQuizIndex];
            
            document.getElementById('hud-level-badge').innerText = getLevelTierLabel(currentQuizIndex);
            document.getElementById('hud-score-counter').innerText = userCurrentScore;
            document.getElementById('hud-index-counter').innerText = currentQuizIndex + 1;
            
            const percent = ((currentQuizIndex + 1) / 50) * 100;
            document.getElementById('quiz-progress-inner').style.width = percent + "%";

            document.getElementById('question-box').innerText = `【${currentQuizIndex + 1}】${quizItem.q}`;
            
            // 【核心彩蛋判斷】如果是第 5 題（索引為 4），顯示消去法按鈕
            const eggBtn = document.getElementById('repar-egg-btn') || document.getElementById('reparo-egg-btn');
            if (currentQuizIndex === 4) {
                eggBtn.style.display = 'block';
            } else {
                eggBtn.style.display = 'none';
            }

            const optBox = document.getElementById('options-box');
            optBox.innerHTML = '';
            
            const arrOpts = [
                { key: 'A', text: quizItem.a },
                { key: 'B', text: quizItem.b },
                { key: 'C', text: quizItem.c },
                { key: 'D', text: quizItem.d }
            ];

            arrOpts.forEach(opt => {
                const div = document.createElement('div');
                div.className = "option-item";
                // 給予一個自訂屬性以便彩蛋函數辨識正確/錯誤答案
                div.setAttribute('data-key', opt.key);
                div.innerHTML = `<strong>${opt.key}：</strong>&nbsp;${opt.text}`;
                div.onclick = () => evaluateUserAnswer(opt.key, div);
                optBox.appendChild(div);
            });

            document.getElementById('feedback-box').style.display = 'none';
        }

        // 【新追加】第 5 題限定的「復復修」消去法彩蛋
        function triggerReparoMagic() {
            const currentQuestion = quizDatabase[currentQuizIndex];
            const allOptionElements = document.querySelectorAll('.option-item');
            const eggBtn = document.getElementById('reparo-egg-btn');
            
            // 找出所有錯誤的答案節點
            let wrongElements = [];
            allOptionElements.forEach(el => {
                const key = el.getAttribute('data-key');
                if (key !== currentQuestion.ans) {
                    wrongElements.push(el);
                }
            });

            // 隨機打亂錯誤答案排序，並挑選其中兩個進行「擦除」
            wrongElements.sort(() => Math.random() - 0.5);
            
            // 抹除前兩個錯誤選項
            if (wrongElements[0]) wrongElements[0].classList.add('erased');
            if (wrongElements[1]) wrongElements[1].classList.add('erased');

            // 播放炫麗魔法聲效與閃爍特效
            playEggMagicSound();
            const flashOverlay = document.getElementById('flash-overlay');
            flashOverlay.style.background = "rgba(255, 215, 0, 0.3)";
            flashOverlay.style.opacity = "1";
            setTimeout(() => { flashOverlay.style.opacity = "0"; }, 300);

            // 施展完後隱藏按鈕
            eggBtn.style.display = 'none';
        }

        function evaluateUserAnswer(chosenKey, elementToken) {
            const currentQuestion = quizDatabase[currentQuizIndex];
            const allOptionElements = document.querySelectorAll('.option-item');
            
            // 隱藏彩蛋按鈕，防止答完還去點擊
            document.getElementById('reparo-egg-btn').style.display = 'none';

            allOptionElements.forEach(el => el.classList.add('disabled'));

            const feedbackAlert = document.getElementById('feedback-alert');
            const flashOverlay = document.getElementById('flash-overlay');
            const quizCard = document.getElementById('view-quiz');

            if(chosenKey === currentQuestion.ans) {
                userCurrentScore++;
                elementToken.classList.add('correct');
                feedbackAlert.innerText = "✓ 正確！魔法力量與你同在！";
                feedbackAlert.className = "feedback-status is-correct";
                playMagicToneSuccess();

                flashOverlay.style.background = "rgba(46, 204, 113, 0.4)";
                flashOverlay.style.opacity = "1";
                setTimeout(() => { flashOverlay.style.opacity = "0"; }, 200);

            } else {
                elementToken.classList.add('wrong');
                feedbackAlert.innerText = "✗ 答錯！魔杖似乎揮錯了方向...";
                feedbackAlert.className = "feedback-status is-wrong";
                playMagicToneFailure();

                allOptionElements.forEach(el => {
                    if(el.getAttribute('data-key') === currentQuestion.ans) {
                        el.classList.add('correct');
                    }
                });

                flashOverlay.style.background = "rgba(231, 76, 60, 0.4)";
                flashOverlay.style.opacity = "1";
                setTimeout(() => { flashOverlay.style.opacity = "0"; }, 200);
                
                quizCard.classList.add('shake-effect');
                setTimeout(() => { quizCard.classList.remove('shake-effect'); }, 400);
            }

            document.getElementById('hud-score-counter').innerText = userCurrentScore;
            document.getElementById('explanation-box').innerText = `正確答案：【${currentQuestion.ans}】。${currentQuestion.exp}`;
            document.getElementById('feedback-box').style.display = 'block';
        }

        function advanceNextQuestion() {
            currentQuizIndex++;
            if(currentQuizIndex < 50) {
                renderQuestionStructure();
            } else {
                concludeQuizSession();
            }
        }

        function concludeQuizSession() {
            document.getElementById('final-score-num').innerText = userCurrentScore;
            
            let titleRank = "";
            if(userCurrentScore >= 45) titleRank = "🏆 霍格華茲傳奇";
            else if(userCurrentScore >= 35) titleRank = "⚡ 魁地奇明星";
            else if(userCurrentScore >= 25) titleRank = "📚 資深巫師";
            else if(userCurrentScore >= 15) titleRank = "🪄 魔法學徒";
            else titleRank = "🐀 爆角怪飼養員";

            document.getElementById('final-rank-badge').innerText = `評定稱號：${titleRank}`;
            commitScoreToStorage(registeredPlayerName, userCurrentScore);
            switchView('view-result');
        }

        // ==========================================
        // 5. 排行榜 LocalStorage 控制
        // ==========================================
        function commitScoreToStorage(name, score) {
            let records = JSON.parse(localStorage.getItem('hogwarts_ranks')) || [];
            const timestamp = new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit' });
            
            records.push({ name: name, score: score, date: timestamp });
            records.sort((a, b) => b.score - a.score);
            
            if(records.length > 10) records = records.slice(0, 10);
            localStorage.setItem('hogwarts_ranks', JSON.stringify(records));
        }

        function showRankingsView() {
            const records = JSON.parse(localStorage.getItem('hogwarts_ranks')) || [];
            const tbody = document.getElementById('rank-table-body');
            tbody.innerHTML = '';

            if(records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#7f8c8d;">名人堂尚無巫師足跡</td></tr>`;
            } else {
                records.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${idx + 1}</td>
                        <td>${escapeHtml(row.name)}</td>
                        <td>${row.score} 分</td>
                        <td>${row.date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            switchView('view-rank');
        }

        function clearRankings() {
            if(confirm("你確定要使用消消樂法術，清除所有名人堂排行榜紀錄嗎？")) {
                localStorage.removeItem('hogwarts_ranks');
                alert("排行榜已歸於塵土。");
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // ==========================================
        // 6. 全螢幕魔法粒子特效動畫
        // ==========================================
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particleArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MagicParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height + canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * -1.2 - 0.3;
                this.speedX = Math.random() * 0.6 - 0.3;
                this.alpha = Math.random() * 0.5 + 0.4;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ffd700';
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particleArray = [];
            const count = Math.min(Math.floor(canvas.width / 15), 80);
            for(let i=0; i<count; i++) {
                particleArray.push(new MagicParticle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particleArray.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();
    </script>
</body>
</html>
